<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Manage your stays at Link Cordoba Hostel.">
  <title>Guest portal | Link Cordoba Hostel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="guest-portal-page" data-page="guestPortal">
  <header class="site-header guest-portal-header">
    <a class="brand" href="index.html" aria-label="Link Cordoba Hostel home"><span class="brand-mark">LC</span><span>Link Cordoba Hostel</span></a>
    <div class="guest-portal-actions">
      <button class="language-toggle" type="button" data-language-toggle>ES</button>
      <button class="guest-signout" type="button" data-guest-signout>Sign out <span aria-hidden="true">↗</span></button>
    </div>
  </header>
  <main class="guest-portal-main">
    <section class="guest-portal-welcome">
      <div>
        <p class="eyebrow">Guest portal</p>
        <h1>Welcome back, <span data-guest-first-name>guest</span></h1>
        <p class="guest-portal-intro">Your stay details, all in one place.</p>
      </div>
      <div class="guest-account-summary">
        <span data-guest-country></span>
        <strong data-guest-email></strong>
        <span data-guest-phone></span>
      </div>
    </section>
    <div class="guest-portal-feedback" data-portal-feedback role="status" aria-live="polite" hidden>
      <span data-portal-feedback-text></span>
      <button type="button" data-portal-retry>Try again</button>
    </div>
    <section class="guest-portal-section guest-booking-section" aria-labelledby="booking-title">
      <div class="guest-portal-section-heading">
        <div><p class="eyebrow">Plan your stay</p><h2 id="booking-title">Request a reservation</h2></div>
      </div>
      <form class="module-form guest-booking-form" data-guest-booking-form>
        <div class="module-form-grid">
          <label><span>Check-in</span><input name="checkIn" type="date" required data-booking-check-in></label>
          <label><span>Check-out</span><input name="checkOut" type="date" required data-booking-check-out></label>
          <label class="module-field-full"><span>Available room</span><select name="roomId" required data-available-rooms><option value="">Select dates to check availability</option></select></label>
          <label><span>Number of beds</span><input name="bedCount" type="number" min="1" max="32767" value="1" required data-booking-bed-count></label>
        </div>
        <p class="guest-availability-note" data-availability-note aria-live="polite"></p>
        <div class="module-form-actions">
          <button class="button button-primary" type="submit" data-booking-submit>Send reservation request <span aria-hidden="true">→</span></button>
        </div>
      </form>
    </section>
    <section class="guest-portal-section" aria-labelledby="upcoming-title">
      <div class="guest-portal-section-heading">
        <div><p class="eyebrow">Your bookings</p><h2 id="upcoming-title" data-upcoming-title>Upcoming stays</h2></div>
      </div>
      <div class="guest-stay-list" data-upcoming-stays aria-live="polite">
        <p class="guest-portal-loading" data-loading-upcoming>Loading your stays...</p>
      </div>
    </section>
    <section class="guest-portal-section guest-history-section" aria-labelledby="history-title">
      <div class="guest-portal-section-heading">
        <div><p class="eyebrow">Your history</p><h2 id="history-title" data-history-title>Past stays</h2></div>
      </div>
      <div class="guest-stay-list" data-past-stays aria-live="polite">
        <p class="guest-portal-loading" data-loading-history>Loading your history...</p>
      </div>
    </section>
  </main>
  <script src="js/language.js"></script>
  <script src="js/guest-portal.js"></script>
</body>
</html>
