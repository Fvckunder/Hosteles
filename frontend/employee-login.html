<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Staff login for Link Cordoba Hostel operations.">
  <title>Staff login | Link Cordoba Hostel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="employee-login-page">
  <!-- El acceso valida el rol del personal con POST /api/Auth/Login antes de abrir el panel. -->
  <main class="employee-login-shell">
    <button class="language-toggle employee-language-toggle" type="button" data-language-toggle>ES</button>
    <section class="employee-login-card">
      <a class="employee-brand" href="index.html"><span class="brand-mark">LC</span><span>Link Cordoba Hostel</span></a>
      <div class="employee-login-heading">
        <p class="dashboard-kicker">Team workspace</p>
        <h1>Welcome back.</h1>
        <p>Sign in to manage the hostel, your team and today&apos;s operations.</p>
      </div>
      <form class="employee-form" data-auth-role="staff">
        <label for="employee-email">Work email</label>
        <input id="employee-email" name="email" type="email" placeholder="name@linkcordoba.com" autocomplete="username" required>
        <label for="employee-password">Password</label>
        <input id="employee-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <div class="employee-form-options">
          <label class="employee-remember"><input type="checkbox"><span>Remember me</span></label>
          <a href="#">Forgot password?</a>
        </div>
        <button class="button employee-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
        <p class="auth-feedback" role="status" aria-live="polite" hidden></p>
      </form>
      <a class="employee-back" href="index.html"><span aria-hidden="true">←</span> Back to public site</a>
    </section>
    <aside class="employee-login-aside">
      <div class="employee-aside-top"><span class="aside-status-dot"></span> Operations dashboard</div>
      <div class="employee-aside-message"><span class="aside-line"></span><p>Everything<br>in one place.</p><small>Rooms · Guests · Team · Reports</small></div>
      <div class="employee-aside-footer"><span>LC / 01</span><span>Staff only</span></div>
    </aside>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/language.js"></script>
</body>
</html>
