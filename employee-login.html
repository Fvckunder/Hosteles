<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="api-base-url" content="">
  <meta name="description" content="Staff login for Link Cordoba Hostel operations.">
  <title>Staff login | Link Cordoba Hostel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="employee-login-page">
  <!-- Acceso de demostración; reemplazar por autenticación real al conectar el backend. -->
  <main class="employee-login-shell">
    <button class="language-toggle employee-language-toggle" type="button" data-language-toggle>ES</button>
    <section class="employee-login-card">
      <a class="employee-brand" href="index.html"><span class="brand-mark">LC</span><span>Link Cordoba Hostel</span></a>
      <div class="employee-login-heading">
        <p class="dashboard-kicker">Team workspace</p>
        <h1>Welcome back.</h1>
        <p>Sign in to manage the hostel, your team and today&apos;s operations.</p>
      </div>
      <form class="employee-form" data-api-login>
        <label for="employee-email">Work email</label>
        <input id="employee-email" name="email" type="email" placeholder="name@linkcordoba.com" autocomplete="username" required>
        <label for="employee-password">Password</label>
        <input id="employee-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        <p class="api-form-status" data-login-status role="status" aria-live="polite"></p>
        <button class="button employee-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <a class="employee-back" href="index.html"><span aria-hidden="true">←</span> Back to public site</a>
    </section>
    <aside class="employee-login-aside">
      <div class="employee-aside-top"><span class="aside-status-dot"></span> Operations dashboard</div>
      <div class="employee-aside-message"><span class="aside-line"></span><p>Everything<br>in one place.</p><small>Rooms · Guests · Team · Reports</small></div>
      <div class="employee-aside-footer"><span>LC / 01</span><span>Staff only</span></div>
    </aside>
  </main>
  <script src="language.js"></script>
  <script src="api.js"></script>
  <script>
    const loginForm = document.querySelector('[data-api-login]');
    const loginStatus = loginForm.querySelector('[data-login-status]');
    const loginButton = loginForm.querySelector('button[type="submit"]');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const isSpanish = document.documentElement.lang === 'es';
      loginStatus.textContent = '';
      loginButton.disabled = true;
      loginStatus.textContent = isSpanish ? 'Verificando acceso…' : 'Signing in…';

      try {
        const formData = new FormData(loginForm);
        await window.hostelApi.request('/api/Auth/Login', {
          method: 'POST',
          body: {
            email: formData.get('email'),
            password: formData.get('password')
          }
        });
        window.location.href = 'employee-dashboard.html';
      } catch (error) {
        loginStatus.textContent = error.message;
      } finally {
        loginButton.disabled = false;
      }
    });
  </script>
</body>
</html>
