<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a guest account at Link Cordoba Hostel.">
  <title>Create guest account | Link Cordoba Hostel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page" data-page="guestRegister">
  <header class="site-header login-header">
    <a class="brand" href="index.html" aria-label="Link Cordoba Hostel home"><span class="brand-mark">LC</span><span>Link Cordoba Hostel</span></a>
    <div class="login-header-actions"><button class="language-toggle" type="button" data-language-toggle>ES</button><a class="back-link" href="login.html"><span aria-hidden="true">←</span> Back to login</a></div>
  </header>
  <main class="login-main registration-main">
    <section class="login-panel registration-panel">
      <div class="login-intro"><p class="eyebrow">Guest account</p><h1>Make yourself<br><em>at home.</em></h1><p>Create an account to keep your stay details together.</p></div>
      <form class="login-form registration-form" data-guest-registration>
        <div class="registration-grid">
          <div><label for="guest-first-name">First name</label><input id="guest-first-name" name="firstName" type="text" maxlength="100" autocomplete="given-name" required></div>
          <div><label for="guest-last-name">Last name</label><input id="guest-last-name" name="lastName" type="text" maxlength="100" autocomplete="family-name" required></div>
          <div class="registration-field-full"><label for="guest-email">Email address</label><input id="guest-email" name="email" type="email" maxlength="255" autocomplete="email" required></div>
          <div><label for="guest-password">Password</label><input id="guest-password" name="password" type="password" minlength="8" maxlength="100" autocomplete="new-password" required></div>
          <div><label for="guest-confirm-password">Confirm password</label><input id="guest-confirm-password" name="confirmPassword" type="password" minlength="8" maxlength="100" autocomplete="new-password" required></div>
          <div class="registration-field-full"><label for="guest-country">Country</label><select id="guest-country" name="countryId" required><option value="">Loading countries...</option></select></div>
          <div><label for="guest-dni">National ID</label><input id="guest-dni" name="dni" type="text" maxlength="20" autocomplete="off"></div>
          <div><label for="guest-passport">Passport</label><input id="guest-passport" name="passport" type="text" maxlength="20" autocomplete="off"></div>
          <p class="registration-hint registration-field-full">Enter a national ID or passport; one is required.</p>
          <div class="registration-field-full"><label for="guest-phone">Phone (optional)</label><input id="guest-phone" name="phone" type="tel" maxlength="30" autocomplete="tel"></div>
        </div>
        <button class="button button-primary button-full" type="submit">Create account <span aria-hidden="true">→</span></button>
        <p class="auth-feedback" role="status" aria-live="polite" hidden></p>
      </form>
      <p class="signup-prompt">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
    <aside class="login-aside"><div class="aside-image"></div><div class="aside-quote"><span>“</span><p>The best journeys<br>bring us home.</p><small>— Link Cordoba Hostel guestbook</small></div></aside>
  </main>
  <script src="registration.js"></script>
  <script src="language.js"></script>
</body>
</html>
